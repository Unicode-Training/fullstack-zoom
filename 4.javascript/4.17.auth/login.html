<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <div class="mx-auto py-5 max-w-300">
      <h1 class="mb-3 font-medium text-3xl text-center">Login</h1>
      <form class="mx-auto max-w-1/3">
        <div class="mb-3">
          <label class="block mb-1 font-medium">Email</label>
          <input
            type="email"
            name="email"
            class="px-3 py-1 border border-gray-200 outline-none w-full"
            placeholder="Email..."
          />
        </div>
        <div class="mb-3">
          <label class="block mb-1 font-medium">Password</label>
          <input
            type="password"
            name="password"
            class="px-3 py-1 border border-gray-200 outline-none w-full"
            placeholder="Password..."
          />
        </div>
        <button
          class="bg-green-600 disabled:opacity-50 px-3 py-1 w-full text-white cursor-pointer"
        >
          Login
        </button>
        <p class="text-red-600 js-msg"></p>
      </form>
    </div>
    <script src="js/config.js"></script>
    <script src="js/login.js"></script>
  </body>
</html>
