<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <form class="mx-auto max-w-100 js-login-form">
      <h2 class="mb-3 font-medium text-3xl">Login</h2>
      <div class="mb-3">
        <label for="">Email</label>
        <input
          type="text"
          class="px-3 py-1 border border-gay-200 rounded-md outline-none w-full js-email"
          placeholder="Email..."
        />
        <span class="text-red-600 text-sm js-error-email"></span>
      </div>
      <div class="mb-3">
        <label for="">Password</label>
        <input
          type="password"
          class="px-3 py-1 border border-gay-200 rounded-md outline-none w-full js-password"
          placeholder="Password..."
        />
        <span class="text-red-600 text-sm js-error-password"></span>
      </div>
      <button
        class="bg-green-600 px-3 py-2 rounded-lg w-full text-white cursor-pointer"
      >
        Login
      </button>
    </form>
    <script src="js/ex04.js"></script>
  </body>
</html>
