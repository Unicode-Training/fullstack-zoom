<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .up,
      .down {
        cursor: pointer;
      }
      .up {
        color: green;
      }
      .down {
        color: red;
      }
      ul {
        list-style: none;
      }
      .box {
        width: 400px;
        margin: 30px auto;
        border: 1px solid #ddd;
        padding: 10px;
      }
      ul li {
        margin: 10px 0;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <ul>
        <li>
          Item 1 <span class="up">Up</span> <span class="down">Down</span>
        </li>
        <li>
          Item 2 <span class="up">Up</span> <span class="down">Down</span>
        </li>
        <li>
          Item 3 <span class="up">Up</span> <span class="down">Down</span>
        </li>
        <li>
          Item 4 <span class="up">Up</span> <span class="down">Down</span>
        </li>
      </ul>
    </div>
    <script src="js/ex08.js"></script>
  </body>
</html>
